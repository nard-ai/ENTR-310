<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTR 310 – Entrepreneurship Quiz (100 Items)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#f4f4f0;min-height:100vh;display:flex;justify-content:center;padding:2rem 1rem}
  #app{width:100%;max-width:680px}
  #quiz{padding:1.5rem 0}
  .header h2{font-size:18px;font-weight:500;color:#1a1a1a}
  .progress-bar-bg{height:4px;background:#e0e0d8;border-radius:2px;margin-bottom:1.5rem}
  .progress-bar-fill{height:4px;background:#1D9E75;border-radius:2px;transition:width 0.4s ease}
  .score-badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;border-radius:8px;background:#efefeb;color:#555;border:0.5px solid #ddd}
  .question-card{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem}
  .q-label{font-size:12px;color:#888;margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em}
  .q-text{font-size:15px;color:#1a1a1a;line-height:1.6;margin-bottom:1.25rem}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice-btn{text-align:left;background:#f7f7f4;border:0.5px solid #ddd;border-radius:8px;padding:10px 14px;font-size:14px;color:#1a1a1a;cursor:pointer;transition:background 0.15s,border 0.15s;line-height:1.5;font-family:inherit}
  .choice-btn:hover:not(:disabled){background:#efefeb;border-color:#bbb}
  .choice-btn.correct{background:#EAF3DE;border-color:#639922;color:#27500A}
  .choice-btn.wrong{background:#FCEBEB;border-color:#A32D2D;color:#501313}
  .feedback{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;display:none}
  .feedback.show{display:block}
  .feedback.correct-fb{background:#EAF3DE;color:#27500A;border:0.5px solid #639922}
  .feedback.wrong-fb{background:#FCEBEB;color:#501313;border:0.5px solid #A32D2D}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
  .nav button{font-size:14px;padding:8px 20px;border-radius:8px;border:0.5px solid #ccc;background:#fff;color:#1a1a1a;cursor:pointer;font-family:inherit}
  .nav button:hover{background:#f7f7f4}
  .nav button.primary{background:#1D9E75;border-color:#0F6E56;color:#fff}
  .nav button.primary:hover{background:#0F6E56}
  .nav button:disabled{opacity:0.4;cursor:default}
  .result-card{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:2rem;text-align:center}
  .result-card h3{font-size:22px;font-weight:500;color:#1a1a1a;margin-bottom:8px}
  .result-card p{font-size:14px;color:#666;margin-bottom:1rem}
  .big-score{font-size:52px;font-weight:500;color:#1D9E75;margin:0.75rem 0}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1.5rem}
  .stat-box{background:#f7f7f4;border-radius:8px;padding:12px;text-align:center}
  .stat-box .val{font-size:20px;font-weight:500;color:#1a1a1a}
  .stat-box .lbl{font-size:11px;color:#888;margin-top:4px}
  .restart-btn{padding:10px 28px;border-radius:8px;border:none;background:#1D9E75;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
  .restart-btn:hover{background:#0F6E56}
</style>
</head>
<body>
<div id="app"><div id="quiz"></div></div>
<script>
const questions = [
  // ── DEFINITIONS OF ENTREPRENEUR ──
  {q:"According to Donnelly, an entrepreneur is an individual propelled by an idea, personal interest, goals, and ambition who brings together which of the following to establish and manage a business enterprise?",choices:["Marketing plans and customer data","Financial and human resources, equipment, and facilities","Government grants and subsidies","Business licenses and permits"],ans:1,exp:"Donnelly defines an entrepreneur as one who brings together the financial and human resources, equipment, and facilities to establish and manage a business enterprise."},
  {q:"According to H. Molt, what does an entrepreneur provide to society through independent initiative?",choices:["Tax revenue","Employment contracts","Added value","Raw materials"],ans:2,exp:"H. Molt defines an entrepreneur as one who incubates new ideas, starts a business based on these ideas, and provides added value to the society on his/her independent initiative."},
  {q:"Joseph Schumpeter defines the entrepreneur in a developing economy as one who:",choices:["Only introduces brand-new industries never seen before","Starts an industry (old or new), undertakes risk, bears uncertainties, and performs managerial functions","Avoids risk and relies on government funding","Manages existing enterprises without making changes"],ans:1,exp:"Schumpeter defines the entrepreneur in a developing economy as one who starts an industry (old or new), undertakes risk, bears uncertainties, and also performs the managerial functions of decision making and coordination."},
  {q:"According to Schumpeter, the entrepreneur in an advanced economy introduces 'something new.' Which of the following is an example of that 'new' thing as stated in the lesson?",choices:["A lower price for an existing product","A method of production not yet tested by experience","Reducing the number of employees","Copying a competitor's product exactly"],ans:1,exp:"Schumpeter states that 'new' in the economy can be a method of production not yet tested by experience, a product with which consumers are not yet familiar, a new source of raw material, or a new market."},

  // ── DEFINITIONS OF ENTREPRENEURSHIP ──
  {q:"Dr. C.B. Gupta's definition of entrepreneurship emphasizes creating wealth by bringing together resources in new ways. What is the starting point of this process?",choices:["Securing bank loans","Identifying opportunities in the marketplace","Hiring the right employees","Registering the business legally"],ans:1,exp:"Gupta defines entrepreneurship as the process of identifying opportunities in the marketplace, marshalling the required resources, and investing them to exploit the opportunities for long-term gains."},
  {q:"Richard Daft's definition of entrepreneurship includes three elements. Which correctly lists those three?",choices:["Innovating, marketing, and distributing","Initiating a business venture, organizing resources, and assuming risks and rewards","Planning, staffing, and controlling","Identifying gaps, hiring employees, and expanding markets"],ans:1,exp:"Richard Daft defines entrepreneurship as the process of initiating a business venture, organizing the necessary resources, and assuming the associated risks and rewards."},
  {q:"Jeffrey Timmons defines entrepreneurship as creating and building value from 'practically nothing.' Which phrase best captures the key spirit of his definition?",choices:["Relying on inherited wealth to start a business","Pursuing an opportunity regardless of the resources currently controlled","Waiting until all resources are secured before starting","Building a business only in familiar industries"],ans:1,exp:"Timmons defines entrepreneurship as a process of creating or seizing an opportunity and pursuing it regardless of the sources currently controlled."},
  {q:"One definition of entrepreneurship states it is the process of identifying, developing, and bringing a vision to life. According to this definition, what can the 'vision' be?",choices:["Only a completely original invention","An innovative idea, an opportunity, or simply a better way to do something","A detailed financial projection","A government contract"],ans:1,exp:"The definition states that the vision may be an innovative idea, an opportunity, or simply a better way to do something, and the end result is the creation of a new venture under conditions of risk and considerable uncertainty."},

  // ── HISTORICAL PERSPECTIVE ──
  {q:"What is the meaning of the word 'entrepreneur' based on its French origin?",choices:["To innovate","To undertake","To invest","To organize"],ans:1,exp:"The word entrepreneur comes from the French verb 'entreprendre,' which means 'to undertake.'"},
  {q:"In the early period, an entrepreneur was described as a merchant adventurer. What was the interest rate on the common contract loan given to the merchant adventurer?",choices:["10 percent","15.5 percent","22.5 percent","30 percent"],ans:2,exp:"During the early period, a common contract provided a loan to the merchant adventurer at a 22.5 percent rate."},
  {q:"Marco Polo is cited in the lesson as an example of an early entrepreneur. What was his role?",choices:["A French military leader","A Venetian merchant, explorer, and writer who traveled the Silk Road to China","A cleric who built castles and cathedrals","A government official who financed projects"],ans:1,exp:"Marco Polo was a Venetian merchant, explorer, and writer who traveled along the Silk Road to China between 1271 and 1295."},
  {q:"During the Middle Ages, the entrepreneur who managed large production projects like the construction of castles and cathedrals was typically:",choices:["A military general","A merchant adventurer","A cleric","A venture capitalist"],ans:2,exp:"The typical entrepreneur during the Middle Ages was the cleric who was responsible for the construction of great buildings such as castles and cathedrals."},
  {q:"In the early 1600s, which group of individuals were also referred to as 'Entrepreneurs'?",choices:["Merchants who traveled to Asia","French men who organized and led military expeditions","Monks who managed church funds","Scientists who invented new tools"],ans:1,exp:"In the early 1600s, French men who organized and led military expeditions were called 'Entrepreneur.'"},
  {q:"In which century did the concept of risk become formally associated with entrepreneurship, where profits and losses reflected the entrepreneur's own efforts?",choices:["15th century","17th century","19th century","20th century"],ans:1,exp:"The concept of risk in entrepreneurship developed in the 17th century, where the entrepreneur entered a contractual arrangement with the government at a fixed price, and any resulting profits or losses reflected the entrepreneur's efforts."},
  {q:"In the 18th century, the entrepreneurial role was distinguished from the capital-providing role. What is the modern equivalent of the capital-providing role?",choices:["Business manager","Entrepreneur","Venture capitalist","Government regulator"],ans:2,exp:"The capital-providing role in the 18th century is the basis for the present-day venture capitalist — a professional money manager who invests in risky investments from a pool of equity capital to obtain a high rate of return."},
  {q:"A venture capitalist is defined in the lesson as:",choices:["An entrepreneur who avoids all risks","A professional money manager who invests in risky investments from a pool of equity capital to obtain a high rate of return","A government official who funds public projects","A bank officer who provides low-interest loans"],ans:1,exp:"A venture capitalist is a professional money manager who invests in risky investments from a pool of equity capital to obtain a high rate of return on the investments."},
  {q:"According to Hisrich (1989), what does the entrepreneur retain after all costs of the enterprise have been paid?",choices:["A fixed government-set salary","The net residue of annual receipts after all costs are paid","An equal share distributed to all workers","A percentage determined by investors"],ans:1,exp:"According to Hisrich (1989), the net residue of the annual receipts of the enterprise after all costs have been paid, the entrepreneur retains for himself."},
  {q:"In the middle of the 20th century, the entrepreneur was primarily viewed as:",choices:["A manager who avoids risk","An innovator who reforms or revolutionizes the pattern of production","A government contractor","A financial investor only"],ans:1,exp:"In the middle of the 20th century, the notion of an entrepreneur as an innovator was established — one who reforms or revolutionizes the pattern of production by exploiting an invention or an untried technological possibility."},
  {q:"The lesson states that innovation is one of the most difficult tasks for the entrepreneur because it requires:",choices:["Only access to large amounts of capital","Only technical skill in production","Not only the ability to create and conceptualize but also to understand all the forces at work in the environment","A government license to operate"],ans:2,exp:"Innovation takes not only the ability to create and conceptualize but also to understand all the forces at work in the environment. The newness can be a new product, a new distribution system, or a new organizational structure."},
  {q:"During the Middle Ages, the key difference between the entrepreneur and earlier merchant adventurers was that the medieval entrepreneur:",choices:["Took greater financial risks than before","Did not take any risk but simply administered the project using resources provided by the government","Traveled greater distances to find markets","Signed contracts at higher interest rates"],ans:1,exp:"During the Middle Ages, the entrepreneur did not take any risk but simply administered the project using the resources provided by the government of the country."},

  // ── CHARACTERISTICS ──
  {q:"The characteristic 'An Eye for Opportunity' means that entrepreneurs:",choices:["Wait for opportunities to come to them","Are always alert to opportunities, quickly see and grab them, and plan intellectually to achieve their goals","Only look for opportunities in familiar industries","Focus on reducing costs rather than finding new markets"],ans:1,exp:"Entrepreneurs with an eye for opportunity are always alert, are very quick to see and grab opportunities, and plan intellectually and anticipate carefully how to achieve their goals in realizing an opportunity."},
  {q:"The characteristic of 'Independence' in entrepreneurs is best described as:",choices:["Refusing to work with any team","Enjoying being their own boss and doing things their own way, fulfilling their need for independence","Working only in large corporations","Depending on the government for business direction"],ans:1,exp:"Entrepreneurs enjoy being their own boss. They like doing things their own way. Their own business fulfills their need for independence, and this characteristic along with determination drives them to start their own business."},
  {q:"'An Appetite for Hard Work' as an entrepreneurial characteristic means entrepreneurs:",choices:["Work only during regular business hours","Start out working long, hard hours with little play, and are persistent in believing hard work will help them attain their goals","Prefer to delegate all work to employees","Focus on leisure time to maintain creativity"],ans:1,exp:"Most entrepreneurs start out working long, hard hours with little play. They are persistent and strongly believe that working hard will help them attain their goals. They focus on the end result."},
  {q:"Self-confidence in entrepreneurs contributes to venture success because it:",choices:["Allows them to ignore market feedback","Couples with a sense of effectiveness to contribute to the success of the venture","Eliminates the need for business planning","Guarantees profit in the first year"],ans:1,exp:"Entrepreneurs must demonstrate extreme self-confidence to cope with the risks of operating their own business. This self-confidence, coupled with a sense of effectiveness, ultimately contributes to the success of the venture."},
  {q:"The characteristic of 'Discipline' in a successful entrepreneur means they:",choices:["Follow government rules strictly","Resist the temptation to do what is unimportant or easiest and use discipline as a guide to their destination","Impose strict rules on all employees without exception","Avoid taking any risks at all"],ans:1,exp:"Successful entrepreneurs resist the temptation to do what is unimportant or the easiest. They are economically efficient, do not like to waste time, and use discipline as a guide to their destination."},
  {q:"The characteristic of 'Judgment' in successful entrepreneurs includes:",choices:["Making decisions based on personal likes and dislikes","Selecting friends and relatives to manage all key positions","Thinking quickly, making wise decisions, and selecting experts rather than friends at the time of need","Avoiding all complex decisions by delegating them"],ans:2,exp:"Successful entrepreneurs have the ability to think quickly and make wise decisions. They are unaffected by personal likes and dislikes, and at the time of their need they select experts rather than friends and relatives to assist them."},
  {q:"'Ability to Accept Change' as a characteristic means that entrepreneurs:",choices:["Stick rigidly to their original plans no matter what","Thrive on changes, look at many solutions, and can choose the best way even if different from what they want","Avoid change to maintain business stability","Only accept changes imposed by the government"],ans:1,exp:"Entrepreneurs thrive on changes and their businesses grow. They look at many solutions to their problems, realize that others may know how to do something better, and can choose the best way even if it is different from how they want to do it."},
  {q:"'Make Stress Work for Them' means entrepreneurs cope with stress by:",choices:["Taking frequent breaks and vacations","Focusing on the end result rather than the process, and solving different complexities at the same time","Avoiding stressful business situations entirely","Hiring stress management consultants"],ans:1,exp:"Entrepreneurs cope by focusing on the end result and not the process of getting there. They are capable of working for long hours and solving different complexities at the same time."},
  {q:"The 'Need to Achieve' characteristic of entrepreneurs means that profit is:",choices:["Always their primary motivation above everything","Often secondary to the drive toward personal success and the desire to achieve higher goals","Irrelevant to their business decisions","Only considered at the end of the fiscal year"],ans:1,exp:"Although entrepreneurs keep an 'eye' on profit, this is often secondary to the drive toward personal success. Entrepreneurs have a strong desire to achieve higher goals. To an entrepreneur, winning is achievement."},
  {q:"'Focus on Profits' as a characteristic means successful entrepreneurs:",choices:["Only care about social impact, not profits","Always have the profit margin in sight and know that business success is measured by profits","Reinvest all profits without ever tracking them","Focus on profits only after five years of operations"],ans:1,exp:"Successful entrepreneurs always have the profit margin in sight and know that their business success is measured by profits."},
  {q:"Risk-bearing entrepreneurs take calculated risk, which is described in the lesson as:",choices:["Gambling all resources on a single venture","Risk that is high enough to be exciting but with a fairly reasonable chance to win","Risk that is always low and completely safe","Risk that is backed by government guarantees"],ans:1,exp:"Entrepreneurs undertake calculated risk which is high enough to be exciting, but with a fairly reasonable chance to win. They choose moderate risk rather than play wild gamble."},
  {q:"Rotter's locus of control theory, as applied to entrepreneurs, states that entrepreneurs believe:",choices:["External forces like luck control all outcomes","They can govern and shape their own destiny by influencing their socio-economic environment","Government policies alone determine their business outcomes","Market forces alone determine success or failure"],ans:1,exp:"Entrepreneurs believe in their own ability to control the consequences of their endeavour by influencing their socio-economic environment rather than leave everything to luck. They strongly believe that they can govern and shape their own destiny."},
  {q:"The 'Creative and Innovators' characteristic means successful entrepreneurs constantly:",choices:["Introduce only cost-cutting measures","Introduce new products, new methods of production, open new markets, and reorganize the enterprise","Follow traditional and conventional ways of doing things","Produce only products that already exist in the market"],ans:1,exp:"Successful entrepreneurs are innovators. They constantly put their efforts in introducing new products, new methods of production, opening new markets, and reorganizing the enterprise."},
  {q:"According to George R. Terry, leadership is defined as:",choices:["The authority to give orders to employees","The activity of influencing people to strive willingly for group objectives","The ability to manage financial accounts","The right to discipline employees who underperform"],ans:1,exp:"According to George R. Terry: 'Leadership is the activity of influencing people to strive willingly for group objectives.'"},
  {q:"Which of the following is listed as a characteristic that an entrepreneur as a leader must possess?",choices:["Isolating themselves from employees","Developing teamwork, building morale, and active participation","Delegating all responsibility to middle managers","Avoiding empathy in all business dealings"],ans:1,exp:"Being the leader of the enterprise, the entrepreneur should possess characteristics including: developing teamwork, building morale, maintenance of discipline, and active participation, among others."},
  {q:"The 'Ability to Mobilize Resources' refers to the entrepreneur's ability to effectively manage the 6Ms. Which correctly lists the 6Ms?",choices:["Money, Marketing, Manufacturing, Motivation, Media, and Management","Man, Money, Material, Machinery, Market, and Method","Mind, Mission, Model, Market, Management, and Metrics","Men, Machines, Materials, Money, Minutes, and Metrics"],ans:1,exp:"Entrepreneurs have to mobilize the 6Ms: Man, Money, Material, Machinery, Market, and Method effectively to realize the final product, as entrepreneurship is a function of gap filling and input completing."},
  {q:"McClelland's theory of need for achievement is closely consistent with which entrepreneurial characteristic?",choices:["An appetite for hard work","Independence","Locus of control","Ability to accept change"],ans:2,exp:"Locus of control is closely consistent with McClelland's theory of need for achievement. Entrepreneurs believe in internal locus of control — that they can govern and shape their own destiny."},

  // ── ENTREPRENEURIAL PROCESS ──
  {q:"The entrepreneurial process consists of four phases. Which correctly lists them in order?",choices:["Planning, financing, marketing, and selling","Identifying and evaluating opportunity, developing the business plan, determining resources, and managing the enterprise","Managing, planning, financing, and innovating","Innovating, marketing, staffing, and controlling"],ans:1,exp:"The entrepreneurial process consists of: (1) Identifying and evaluating a business opportunity, (2) Developing the business plan, (3) Determining the resources required, and (4) Managing the resulting enterprise."},
  {q:"The lesson states that the phases of the entrepreneurial process overlap. What does this mean?",choices:["Each phase must be fully completed before the next begins","An activity will be started before the one already started is completed","All phases are done simultaneously from the very beginning","Only two phases can overlap at the same time"],ans:1,exp:"These activities overlap, meaning an activity will be started before the one that has already been started is completed. The entrepreneur may need to consider later phases while still carrying out phase one."},
  {q:"What are the common sources of new business opportunities mentioned in the lesson?",choices:["Government agencies, banks, and shareholders","Consumers, members of distribution channels, and technical people","Competitors, advertisers, and accountants","Media outlets, celebrities, and politicians"],ans:1,exp:"There are some sources such as consumers, members of distribution channels, and technical people that are generally fruitful sources of business opportunities."},
  {q:"In the evaluation phase of identifying a business opportunity, which of the following is assessed?",choices:["The entrepreneur's social media following","The opportunity's risks and returns, its differential advantage, and its fit with the personal skills and goals of the entrepreneur","The number of competitors in the market only","The government's approval of the business idea"],ans:1,exp:"The evaluation phase deals with the assessment of the opportunity for its length, real and perceived value, risks and returns, differential advantage in its competitive environment, and its fit with the personal skills and goals of the entrepreneur."},
  {q:"The lesson warns that even with a brilliant business idea, a person may not become a successful entrepreneur if:",choices:["They have too much capital available","They do not have the necessary interest or skill to start a new venture","They are too young to run a business","They have not studied business formally in school"],ans:1,exp:"It is very important to note that the opportunity must also fit the personal interests of the entrepreneur. A person without the necessary interest or skill to start a new venture may not become a successful entrepreneur even if he or she has a brilliant business idea."},
  {q:"A business plan is described in the lesson as the 'blueprint' for what?",choices:["The marketing campaign only","The implementation process","The hiring process","The government registration"],ans:1,exp:"A business plan is a comprehensive document — the 'blueprint' for the implementation process — that the entrepreneur prepares before going to the implementation stage."},
  {q:"When determining required resources, the entrepreneur must classify resources into two categories. What are these two categories?",choices:["Local and international resources","Vital resources and resources that are just helpful","Human and financial resources only","Short-term and long-term resources"],ans:1,exp:"The entrepreneur needs to classify the required resources into two: the ones that are vital and the ones that are just helpful. It is also important to evaluate the impact of insufficient or inappropriate resources on the business."},
  {q:"In the 'Managing the Venture' phase, what does the entrepreneur primarily do?",choices:["Only handles the marketing of products","Deploys resources through implementation of the business plan and sets up an effective control mechanism to tackle emerging problems","Hands over all management duties to hired managers immediately","Focuses only on raising additional capital from investors"],ans:1,exp:"Once the required resources are acquired, the entrepreneur deploys them through the implementation of the business plan and sets up an effective control mechanism to identify and tackle emerging problems and challenges on time."},
  {q:"Generally, a new business opportunity may be the result of which of the following, as stated in the lesson?",choices:["Personal ambition alone","Technological change, market shift, government regulation, or competition","Pure luck and coincidence","Advice from family members"],ans:1,exp:"Generally, a new business opportunity may be the result of a technological change, market shift, government regulation, or competition."},
  {q:"Distribution channel members are cited as good sources of business ideas because:",choices:["They have the most financial capital to invest","Their proximity to consumers gives them the opportunity to better see a market gap or a demand for a better product","They are required by law to report market gaps to entrepreneurs","They have the most advanced technology available"],ans:1,exp:"Distribution channel members such as wholesalers, distributors, and retailers are good sources of business ideas. Their proximity to consumers gives them the opportunity to better see a market gap or demand for a better product."},

  // ── CHALLENGES ──
  {q:"Entrepreneurial problems are divided into two groups. Internal problems affecting entrepreneurs include:",choices:["Political factors and government regulations","Social and technological forces beyond control","Organization, structure, production channel, distribution channel, technical know-how, training, and management inadequacy","Competition from foreign companies"],ans:2,exp:"Internal problems affecting entrepreneurs relate to organization, structure, production channel, distribution channel, technical know-how, training, industrial relations, and inadequacy of management."},
  {q:"'Management deficiency' is described in the lesson as one of the biggest reasons for:",choices:["High interest rates from banks","Poor performance of small-scale units","Market saturation","Political instability in the economy"],ans:1,exp:"It could be said that management deficiency is one of the biggest reasons for poor performance of small-scale units, as new entrants often lack prior training or background in management."},
  {q:"Which of the following is stated as a reason why financial institutions resist providing loans to entrepreneurs?",choices:["Entrepreneurs have too much existing capital","Entrepreneurial businesses are generally viewed as risky investments due to their newness and smallness","Entrepreneurs refuse to provide collateral","Entrepreneurs do not pay interest on loans"],ans:1,exp:"Entrepreneurial businesses are generally viewed as risky investments due to their newness and smallness. Consequently, financial institutions resist providing loans for entrepreneurs."},
  {q:"Technological forces are described in the lesson as 'the most abrupt and unpredictable part of an entrepreneurial environment' because:",choices:["Technology changes are always gradual and easy to adapt to","The knowledge behind technological change may take years to develop, but the actual application makes it seem more like a revolution than evolution","Entrepreneurs always have advance access to new technology","Government controls all technological changes in the economy"],ans:1,exp:"Technological forces are often the most abrupt and unpredictable. The knowledge behind technological change may take several years to develop, but the impact of the breakthrough makes it seem more like a revolution than evolution when the application occurs."},
  {q:"'Limited Access to Market' as a challenge means:",choices:["Entrepreneurs cannot legally sell their products","The cost of penetrating existing or new markets is relatively high for a newly developed entrepreneurial business","Entrepreneurs have too many customers to serve at once","There are no competitors in the market at all"],ans:1,exp:"Entrepreneurs face overall limitations on penetrating and servicing their markets. The cost of penetrating the existing or new market is relatively high for the newly developed business of an entrepreneur."},
  {q:"Political factors as an external challenge to entrepreneurship require entrepreneurs to:",choices:["Ignore government policies and focus only on business","Anticipate and adjust to changes in regulation, directives, and laws from various levels of government and governmental agencies","Lobby governments to remove all regulations","Operate only in politically stable countries"],ans:1,exp:"Entrepreneurs must anticipate and adjust to changes in regulation, directives, and laws from various levels of government and governmental agencies."},
  {q:"The lesson states that both internal and external entrepreneurial problems 'are not mutually exclusive.' What does this mean?",choices:["They are completely separate and independent of each other","They are co-related and can influence each other","Only one type can exist at a time in a business","External problems always directly cause internal problems"],ans:1,exp:"Both kinds of problems are not mutually exclusive — they are co-related. Internal and external problems can influence each other."},
  {q:"'Longer loan processing time' as a financial challenge means:",choices:["Banks reject all loan applications from entrepreneurs","The approval procedures are slow, often times leading to slower disbursements of funds","Entrepreneurs are given loans immediately but with high interest","Banks process loans faster for entrepreneurs than for corporations"],ans:1,exp:"The processing time for loan applications by entrepreneurs tends to be long. The approval procedures are slow, often times leading to slower disbursements."},

  // ── DARK SIDES / RISKS ──
  {q:"The lesson states that entrepreneurs who successfully innovate and start businesses have a few things others do not. Which of the following best summarizes these qualities?",choices:["They are always rational and never emotional about their businesses","They are willing to accept risk, cope with ambiguity, and have a drive to put their imprint on what they are creating","They prefer stability over growth at all times","They depend on others to take risks on their behalf"],ans:1,exp:"People who successfully innovate and start businesses are willing to accept risk for what they believe in, have the ability to cope with a professional life riddled by ambiguity and lack of clarity, and have a drive to put their imprint on whatever they are creating."},
  {q:"Financial risk in entrepreneurship specifically exposes the entrepreneur to the possibility of:",choices:["Losing only non-essential personal items","Personal bankruptcy, as they may sign on company obligations far exceeding their personal net worth","Temporary loss of business reputation only","Reduced salary as a salaried employee"],ans:1,exp:"The entrepreneur may be required to sign personally on company obligations that far exceed his or her personal net worth. The entrepreneur is thus exposed to personal bankruptcy."},
  {q:"Family and social risk in entrepreneurship refers to:",choices:["The risk of losing business customers permanently","Entrepreneurs exposing their families to an incomplete family experience, possible permanent emotional scars, and old friends vanishing slowly","The risk of government fines for family-run businesses","The loss of family-owned property only"],ans:1,exp:"Starting a new venture uses much of the entrepreneur's energy and time. Entrepreneurs who are married, especially those with children, expose their families to the risk of an incomplete family experience and the possibility of permanent emotional scars. Old friends may also vanish slowly because of missed get-togethers."},
  {q:"Psychic risk is described in the lesson as potentially 'the greatest risk' because:",choices:["It results in the largest financial loss","Some entrepreneurs who have suffered financial catastrophes have been unable to bounce back due to the severe psychological impact","It affects only the entrepreneur's physical health","It causes permanent damage to the business's brand reputation"],ans:1,exp:"The greatest risk may be to the well-being of the entrepreneur. Some entrepreneurs who have suffered financial catastrophes have been unable to bounce back, at least not immediately. The psychological impact has proven to be too severe for them."},
  {q:"Career risk is a major concern particularly for which type of person considering entrepreneurship?",choices:["Students with no prior work experience","Managers who have a secure organizational job with a high salary and a good benefit package","People who are already unemployed","Young entrepreneurs with no financial responsibilities"],ans:1,exp:"Career risk is a major concern to managers who have a secure organizational job with a high salary and a good benefit package, and who worry about whether they will be able to find a job or go back to their old job if their venture fails."},
  {q:"The lesson mentions that many people are unwilling to start a new business because they are reluctant to risk their:",choices:["Time and social connections only","Savings, house, property, and salary","Professional reputation only","Educational credentials"],ans:1,exp:"Many people are unwilling to risk their savings, house, property, and salary to start a new business — all of which are at stake under financial risk."},

  // ── ROLES IN THE ECONOMY ──
  {q:"According to the US Small Business Administration cited in the lesson, small businesses employ what percentage of all private sector workers?",choices:["25 percent","51 percent","74 percent","99 percent"],ans:1,exp:"According to the US Small Business Administration, small businesses employ 51 percent of all private sector workers."},
  {q:"According to the US Small Business Administration cited in the lesson, small businesses comprise more than what percentage of all employers?",choices:["51 percent","74 percent","90 percent","99 percent"],ans:3,exp:"According to the US Small Business Administration, small businesses comprise more than 99 percent of employers."},
  {q:"'Better Production Methods and Products' as a role of entrepreneurship means improvements can be in terms of:",choices:["Only reducing the price of products","Price, quality, location, ease of use, packaging, or effectiveness of the product","Only improving the packaging of existing products","Only increasing production speed"],ans:1,exp:"Entrepreneurs often introduce better production methods, and the improvement may be in terms of price, quality, location, ease of use, packaging, effectiveness of the product, etc."},
  {q:"'Identification of Business Opportunities and Markets' as a role means that once entrepreneurs identify an exploitable opportunity, their entry into the market has what broader effect?",choices:["It eliminates all competition permanently","It brings the opportunity for others to establish similar businesses and meet the rest of the market's need","It creates a monopoly for the original entrepreneur","It reduces the number of businesses in the economy"],ans:1,exp:"Once entrepreneurs identify an exploitable market opportunity, their act of entering the market brings the opportunity for others to establish their own similar businesses and meet the rest of the market's need."},
  {q:"'Conservation of Natural Resources' as a role of entrepreneurship occurs when entrepreneurs:",choices:["Mine more natural resources for higher production","Invent production methods that consume less energy and raw materials","Sell natural resources to foreign companies","Relocate businesses to areas with more abundant natural resources"],ans:1,exp:"Some people became successful entrepreneurs because they managed to invent production methods that consumed less energy and raw materials. Such technologies result in the conservation of natural resources."},
  {q:"What are 'complementary goods' as referenced in the lesson, and which example is given?",choices:["Goods that compete with each other; cars and motorcycles","Products used together; tea and sugar are given as examples","Products sold at the same price; bread and butter","Goods produced by the same company; soap and shampoo"],ans:1,exp:"Complementary goods are products that are used together. Tea and sugar are given as good examples in the lesson."},
  {q:"'Increase in Per Capita Output and Income' as a role of entrepreneurship results from:",choices:["Entrepreneurs paying higher taxes to the government","Entrepreneurial business activities resulting in increased income for the entrepreneur, employees, and related businesses, and increased supply of goods and services in the economy","Entrepreneurs reducing their workforce","Government redistribution of wealth to businesses"],ans:1,exp:"Entrepreneurial business activities result in increased income for the entrepreneur, his or her employees, and other related businesses. The supply of goods and services in the economy also increases, eventually leading to an increase in per capita output and income."},
  {q:"'Generation of Foreign Currency' as a role of entrepreneurship applies to:",choices:["Any entrepreneur who opens a business","Entrepreneurs that are in the export business and generate significant foreign currency for their home countries","Entrepreneurs who import goods from abroad","Only government-owned enterprises"],ans:1,exp:"Entrepreneurs in the export business generate significant foreign currency for their home countries, contributing to the development of the country's economy by making more foreign currency available for increased volume of imports."},
  {q:"'Better Utilization of Resources' as a role of entrepreneurship means entrepreneurs:",choices:["Find ways to extract more from expensive existing resources","Invent methods and processes that enable the production of goods from resources that have been ignored and labeled as 'useless'","Import more resources from other countries to fill gaps","Reduce the total number of resources used in all production"],ans:1,exp:"Some entrepreneurs become successful by inventing methods and processes that enable the production of goods out of resources that have been ignored and labeled as 'useless.' This leads to improved use of neglected resources and conservation of the ones already in use."},
  {q:"'Improvement of Business Policies and Procedures' as a role of entrepreneurship happens because:",choices:["Entrepreneurs lobby for lower taxes from the government","Entrepreneurs create businesses with new transactions that don't fit existing regulatory systems, instigating the revision and development of new business systems, laws, rules, and policies","Entrepreneurs follow all existing rules without question","Government creates new policies entirely independently of businesses"],ans:1,exp:"Entrepreneurs create businesses that involve new transactions which do not fit into the existing business regulatory system, thus requiring the development of new business systems, laws, rules, and policies. This leads to better and safer business environments."},
  {q:"'Positive Externalities' as a role of entrepreneurship refers to:",choices:["The profit gained from selling goods at higher prices","The good byproducts of a business enjoyed by the nearby community, such as roads or electricity","Tax exemptions given to entrepreneurs by the government","The reduction of business competition in a local market"],ans:1,exp:"Positive externalities are the good byproducts of a business that the nearby community enjoys. The entrepreneur, while establishing his or her business, may develop infrastructure such as streets, electricity, and water wells that will be shared by the community as well."},
  {q:"'Business Opportunity for Suppliers' as a role of entrepreneurship arises because:",choices:["Entrepreneurs produce all their own inputs internally","Entrepreneurs cannot supply the inputs needed for their business on their own, resulting in business opportunities for other businesses that supply those resources","Suppliers are required by law to support all entrepreneurial ventures","Entrepreneurs buy raw materials only from government-approved suppliers"],ans:1,exp:"The entrepreneur needs to acquire inputs such as employees and raw materials. In most cases the entrepreneur will not be able to supply these inputs on his or her own, so these resources must be supplied by other businesses — creating a business opportunity for suppliers."},
  {q:"The 'Abolition of Monopoly and Enhancement of Competition' role of entrepreneurship results in lower prices for consumers because:",choices:["Entrepreneurs collude with monopolies to set prices","Entrepreneurs discover key knowledge or create alternative methods to supply similar or substitute goods and services, fostering keener competition","Governments force monopolies to lower prices","Only foreign companies can break local monopolies"],ans:1,exp:"Entrepreneurs often bring an end to monopolies by discovering key knowledge or creating alternative methods. By supplying substitute goods and services, entrepreneurs foster keener competition in many markets, which naturally results in lower prices for consumers."},

  // ── INNOVATION AND CREATIVITY ──
  {q:"Drucker defines innovation as 'the specific function of entrepreneurship.' According to this definition, what are the two things innovation can do for resources?",choices:["Reduce costs and increase output efficiency","Either create new wealth-producing resources or endow existing resources with enhanced potential for creating wealth","Replace all existing production methods entirely","Eliminate the need for human labor in production"],ans:1,exp:"Drucker defines innovation as a means by which the entrepreneur either creates new wealth-producing resources or endows existing resources with enhanced potential for creating wealth."},
  {q:"Innovation is described in the lesson as the process by which entrepreneurs convert opportunities into marketable ideas, making them:",choices:["Recipients of government funding","Catalysts for change","Managers of existing businesses","Suppliers of raw materials"],ans:1,exp:"Innovation is the process by which entrepreneurs convert opportunities into marketable ideas. It is a means by which they become catalysts for change."},
  {q:"Creativity is defined in the lesson as:",choices:["The ability to copy successful business models from abroad","The generation of ideas that result in the improved efficiency or effectiveness of a system","The process of reducing all business costs","The act of registering a patent for a new product"],ans:1,exp:"Creativity is the generation of ideas that result in the improved efficiency or effectiveness of a system."},
  {q:"In the innovative process, which two important aspects of creativity are identified in the lesson?",choices:["Product and pricing","Process and people","Marketing and distribution","Capital and labor"],ans:1,exp:"Two important aspects of creativity exist: process and people. The process is goal-oriented and designed to attain a solution to a problem. The people are the resources that determine the solution."},
  {q:"The lesson states that in the creative process, the process is goal-oriented and is designed to:",choices:["Generate profit for the entrepreneur","Attain a solution to a problem","Attract investors and capital","Produce a marketable product immediately"],ans:1,exp:"The process in creativity is goal-oriented; it is designed to attain a solution to a problem. The people are the resources that determine the solution."},
  {q:"The lesson states that creativity is a process that can be:",choices:["Only inherited from one's family","Developed and improved over time","Taught only in formal business schools","Measured by the number of patents filed"],ans:1,exp:"The lesson states that creativity is a process that can be developed and improved."},

  // ── ETHICS ──
  {q:"'Integrity' as a key ethical principle for entrepreneurs means:",choices:["Maximizing profits at all costs","Being honest, transparent, and consistent in one's actions and decisions","Treating employees strictly and without emotion","Following only the rules that directly benefit the business"],ans:1,exp:"Integrity means being honest, transparent, and consistent in one's actions and decisions."},
  {q:"'Responsibility' as a key ethical principle for entrepreneurs means:",choices:["Delegating all accountability to employees","Accepting accountability for the consequences of one's actions and decisions","Avoiding all situations where mistakes can occur","Following government instructions only"],ans:1,exp:"Responsibility means accepting accountability for the consequences of one's actions and decisions."},
  {q:"'Fairness' as a key ethical principle for entrepreneurs means:",choices:["Giving the most benefits to the highest-performing employees only","Treating all stakeholders equitably and without discrimination","Being fair only to customers, not to suppliers","Offering fair prices compared to competitors"],ans:1,exp:"Fairness means treating all stakeholders equitably and without discrimination."},
  {q:"'Respect' as a key ethical principle for entrepreneurs means:",choices:["Giving employees authority over the entrepreneur","Valuing the dignity, privacy, and rights of all individuals","Respecting only customers, not competitors","Following social media trends and public opinion"],ans:1,exp:"Respect means valuing the dignity, privacy, and rights of all individuals."},
  {q:"'Compassion' as a key ethical principle for entrepreneurs means:",choices:["Prioritizing profit over people's well-being at all times","Demonstrating empathy and concern for the well-being of others","Feeling sorry for competitors who fail","Giving charity only when required by law or regulation"],ans:1,exp:"Compassion means demonstrating empathy and concern for the well-being of others."},
  {q:"Which of the following is NOT one of the five key ethical principles for entrepreneurs listed in the lesson?",choices:["Integrity","Profitability","Fairness","Compassion"],ans:1,exp:"The five key ethical principles listed are: Integrity, Responsibility, Fairness, Respect, and Compassion. Profitability is not listed as a key ethical principle."},

  // ── SOCIAL RESPONSIBILITY ──
  {q:"Which of the following is listed as a way entrepreneurs can implement social responsibility?",choices:["Developing products or services that address social or environmental challenges","Focusing only on maximizing shareholder returns","Avoiding interaction with non-profit organizations","Reducing the number of employees to cut costs"],ans:0,exp:"Entrepreneurs can implement social responsibility by developing products or services that address social or environmental challenges."},
  {q:"Fostering diversity, equity, and inclusion in the workplace is listed in the lesson as a form of:",choices:["Financial management strategy","Social responsibility implementation","Competitive marketing strategy","Legal compliance only"],ans:1,exp:"Fostering diversity, equity, and inclusion in the workplace is listed as one of the ways entrepreneurs can integrate social responsibility into their business practices."},
  {q:"'Engaging in transparent and responsible communication with stakeholders' is described as:",choices:["A legal requirement for all businesses worldwide","One of the ways entrepreneurs implement social responsibility","A marketing tactic to attract new customers","A method to avoid government regulation"],ans:1,exp:"Engaging in transparent and responsible communication with stakeholders is listed in the lesson as one of the ways entrepreneurs can integrate social responsibility into their business practices."},
  {q:"'Adopting sustainable business practices to minimize negative environmental impacts' is listed in the lesson as:",choices:["An optional government recommendation only","One way entrepreneurs can integrate social responsibility into their business practices","A purely financial cost-cutting strategy","A legal requirement for all manufacturing businesses"],ans:1,exp:"Adopting sustainable business practices to minimize negative environmental impacts is explicitly listed as one of the ways entrepreneurs can integrate social responsibility into their business practices."},

  // ── APPLIED / SCENARIO QUESTIONS ──
  {q:"Maria left a well-paying corporate job to start her own bakery. Her biggest worry is whether she can return to her corporate career if the bakery fails. Which type of entrepreneurial risk does Maria face?",choices:["Financial risk","Psychic risk","Career risk","Family and social risk"],ans:2,exp:"Career risk is the concern of whether entrepreneurs will be able to find a job or go back to their old job if their venture fails — a major concern to managers who have a secure organizational job with high salary and good benefits."},
  {q:"Jose spent all his savings and mortgaged his house to start a business. The business failed, and he now faces personal bankruptcy. Which type of entrepreneurial risk does this represent?",choices:["Career risk","Family and social risk","Psychic risk","Financial risk"],ans:3,exp:"Financial risk involves putting a significant portion of savings or other resources at stake. The entrepreneur may be required to sign personally on company obligations far exceeding personal net worth, exposing him to personal bankruptcy."},
  {q:"An entrepreneur who works 18-hour days and misses family events, causing emotional distance from her children and the disappearance of old friends, is experiencing which type of entrepreneurial risk?",choices:["Financial risk","Career risk","Family and social risk","Psychic risk"],ans:2,exp:"Family and social risk refers to the entrepreneur exposing their family to an incomplete family experience and the possibility of permanent emotional scars, as well as old friends vanishing slowly because of missed get-togethers."},
  {q:"After his business collapsed, an entrepreneur became severely depressed and was unable to bounce back for years. Which type of entrepreneurial risk does this best illustrate?",choices:["Financial risk","Career risk","Family and social risk","Psychic risk"],ans:3,exp:"Psychic risk is the greatest risk — to the well-being of the entrepreneur. Some entrepreneurs who have suffered financial catastrophes have been unable to bounce back, at least not immediately, because the psychological impact has proven to be too severe."},
  {q:"A new smartphone brand enters a market previously dominated by one company, offering a similar product at a lower price, causing the dominant company to lower its prices too. Which role of entrepreneurship does this best represent?",choices:["Conservation of natural resources","Development of complementary goods producers","Abolition of monopoly and enhancement of competition","Generation of foreign currency"],ans:2,exp:"Entrepreneurs often bring an end to monopolies. By supplying substitute goods and services, entrepreneurs foster keener competition in many markets, which naturally results in lower prices for consumers."},
  {q:"A local clothing manufacturer begins exporting its products to Japan and Europe, earning foreign currency for the country. Which role of entrepreneurship does this illustrate?",choices:["Creation of job opportunities","Generation of foreign currency","Positive externalities","Better utilization of resources"],ans:1,exp:"Entrepreneurs in the export business generate significant foreign currency for their home countries, contributing to the development of the country's economy by making more foreign currency available for increased volume of imports."},
  {q:"An entrepreneur builds a factory in a rural area and also constructs roads and installs electricity in the surrounding community. Which role of entrepreneurship does this represent?",choices:["Development of complementary goods producers","Business opportunity for suppliers","Positive externalities","Increase in per capita output and income"],ans:2,exp:"Positive externalities are the good byproducts of a business that the nearby community enjoys. The entrepreneur, while establishing his or her business, may develop infrastructure such as streets, electricity, and water wells that will be shared by the community as well."},
  {q:"A car manufacturing company opens in a city, and months later several auto repair shops, tire shops, and car accessory stores open nearby. Which role of entrepreneurship does this represent?",choices:["Abolition of monopoly","Conservation of natural resources","Development of complementary goods producers","Better utilization of resources"],ans:2,exp:"Complementary goods are products used together. An entrepreneur establishing a local car manufacturing company will indirectly contribute to the establishment of a number of local car repair shops and related businesses."},
  {q:"An entrepreneur discovers that coconut husks, previously considered waste, can be turned into furniture and construction materials. Which role of entrepreneurship does this represent?",choices:["Generation of foreign currency","Better utilization of resources","Development of complementary goods producers","Positive externalities"],ans:1,exp:"Some entrepreneurs become successful by inventing methods and processes that enable the production of goods out of resources that have been ignored and labeled as 'useless.' This leads to improved use of neglected resources."},
  {q:"A startup launches the first-ever online food delivery service in a country where only dine-in restaurants existed. According to Schumpeter, this entrepreneur in an advanced economy is best described as:",choices:["A manager who reduces operational costs","An individual who introduces something new into the economy — a new market and method","A cleric who administers government projects","A merchant adventurer who signs contracts with money persons"],ans:1,exp:"Schumpeter defines the entrepreneur in an advanced economy as an individual who introduces something new — which can be a new market, a new method of production, a new product, or a new source of raw material."},
  {q:"An engineer working on a solar panel project discovers a new, cheaper way to manufacture the panels and uses this discovery to start her own solar energy company. According to the lesson, what source of business opportunity did she use?",choices:["Consumers","Distribution channel members","Government agencies","Technical people"],ans:3,exp:"Technical people working on various projects may come across a new or better way to manufacture a product, making them a good source of business ideas."},
  {q:"A wholesaler notices that no one is selling reusable water bottles in his region, even though demand is high, and then starts his own bottling company. According to the lesson, what source of business opportunity did he use?",choices:["Technical people","Consumers","Government agencies","Distribution channel members"],ans:3,exp:"Distribution channel members such as wholesalers, distributors, and retailers are good sources of business ideas. Their proximity to consumers gives them the opportunity to better see a market gap or demand for a better product."},
  {q:"A customer complains, 'I wish there were a product specially made for people with allergies.' An entrepreneur uses this complaint to develop a new hypoallergenic product line. According to the lesson, what source of business opportunity did she use?",choices:["Technical people","Government regulation","Consumers","Distribution channel members"],ans:2,exp:"Often, the most and best business ideas come from customers. Complaints and remarks such as 'I wish I could find a product specially made for...' may result in the inception of a new business idea."},
  {q:"Which of the following best describes the relationship between entrepreneurship and innovation according to the lesson?",choices:["Innovation is optional and not essential to entrepreneurship","Innovation is the specific function of entrepreneurship and the means by which entrepreneurs convert opportunities into marketable ideas","Entrepreneurship only involves financial management, not innovation","Innovation is only relevant to high-technology businesses"],ans:1,exp:"Innovation is the specific function of entrepreneurship. It is the process by which entrepreneurs convert opportunities into marketable ideas, acting as a catalyst for change."},
  {q:"An entrepreneur who partners with a non-profit organization to plant trees for every product sold is best practicing which concept?",choices:["Financial risk management","Social responsibility implementation","Career risk mitigation","Locus of control"],ans:1,exp:"Engaging in philanthropic activities or partnering with non-profit organizations is listed in the lesson as one of the ways entrepreneurs can integrate social responsibility into their business practices."},
  {q:"The lesson describes entrepreneurship as a 'function of gap filling and input completing.' This phrase most directly refers to which entrepreneurial characteristic?",choices:["Need to achieve","Focus on profits","Ability to mobilize resources","Locus of control"],ans:2,exp:"The ability to mobilize resources — the 6Ms — effectively to realize the final product is described in the lesson as entrepreneurship being a function of gap filling and input completing."},
  {q:"An entrepreneur evaluating a business opportunity assesses its 'differential advantage in its competitive environment.' What does this mean in the context of the entrepreneurial process?",choices:["How much government funding is available for the idea","What makes the opportunity unique or superior compared to competing options in the market","How many employees the business will need","Whether the business is in a popular industry"],ans:1,exp:"The evaluation phase deals with the assessment of the opportunity for its differential advantage in its competitive environment — what makes it unique or superior — as well as its fit with the personal skills and goals of the entrepreneur."},
  {q:"According to the lesson, which of the following best explains why 'no preferential interest rates' is a limitation on entrepreneurs' access to finance?",choices:["Banks offer entrepreneurs the lowest rates available","Most entrepreneurs are unable to afford the high interest rates charged by banks and other financial institutions","Entrepreneurs always qualify for government-subsidized rates","Banks only charge interest on ventures that have already failed"],ans:1,exp:"No preferential interest rates means that most entrepreneurs are unable to afford the high interest rates charged by banks and other financial institutions, making access to finance difficult."},
  {q:"The lesson emphasizes that good administrative work in entrepreneurship depends on effective leadership. This is because the entrepreneur's leadership:",choices:["Is secondary to their financial management skills","Reduces problems through careful listening and proper handling of situations","Is only important in large companies with many employees","Only applies to managing external customers"],ans:1,exp:"Entrepreneurs by their own leadership styles and behaviour reduce the problems with careful listening and proper handling of situations. Good administrative work depends upon effective leadership of the entrepreneur."},
  {q:"An entrepreneur invents a process that converts used plastic bottles into affordable building materials. This best illustrates which two roles of entrepreneurship simultaneously?",choices:["Career risk and financial risk","Abolition of monopoly and generation of foreign currency","Better utilization of resources and conservation of natural resources","Positive externalities and development of complementary goods producers"],ans:2,exp:"Inventing methods to use previously 'useless' resources (used plastic bottles) demonstrates better utilization of resources, while reducing raw material consumption and waste demonstrates conservation of natural resources."},
  {q:"According to the lesson, what happens to the concept of innovation when it is actually applied to a product or process, even though the underlying knowledge took years to develop?",choices:["It appears as a gradual evolution in the market","It makes the change seem more like a revolution than evolution","It goes unnoticed by most consumers","It results in immediate government regulation"],ans:1,exp:"The knowledge behind technological change may take several years to develop, but the impact of the breakthrough into an actual product or process makes it seem more like a revolution than evolution when the application of technology occurs."},
];

let shuffled=[], answered=[], score=0, current=0;

function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function init(){
  shuffled=shuffle(questions);
  answered=new Array(shuffled.length).fill(null);
  score=0; current=0;
  render();
}

function render(){
  const el=document.getElementById('quiz');
  if(current>=shuffled.length){
    const pct=Math.round(score/shuffled.length*100);
    let grade='';
    if(pct>=90)grade='Excellent!';
    else if(pct>=80)grade='Great job!';
    else if(pct>=70)grade='Good effort!';
    else if(pct>=60)grade='Keep studying!';
    else grade='Review the lesson and try again!';
    el.innerHTML=`<div class="result-card">
      <h3>Quiz Complete!</h3>
      <p>ENTR 310 – Lesson 1: The Nature of Entrepreneurship</p>
      <div class="big-score">${score}/${shuffled.length}</div>
      <p style="font-size:16px;font-weight:500;color:#1D9E75;margin-bottom:1.5rem">${grade} &nbsp;(${pct}%)</p>
      <div class="stats-grid">
        <div class="stat-box"><div class="val" style="color:#27500A">${score}</div><div class="lbl">Correct</div></div>
        <div class="stat-box"><div class="val" style="color:#A32D2D">${shuffled.length-score}</div><div class="lbl">Wrong</div></div>
        <div class="stat-box"><div class="val">${pct}%</div><div class="lbl">Score</div></div>
      </div>
      <button class="restart-btn" onclick="init()">Retake Quiz (Reshuffled)</button>
    </div>`;
    return;
  }
  const q=shuffled[current];
  const pct=Math.round(current/shuffled.length*100);
  const done=answered[current]!==null;
  el.innerHTML=`
    <div class="header" style="margin-bottom:1.5rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2>ENTR 310 Quiz</h2>
        <span class="score-badge">Score: ${score}/${shuffled.length}</span>
      </div>
      <div style="font-size:13px;color:#888;margin-bottom:8px">Question ${current+1} of ${shuffled.length}</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="question-card">
      <div class="q-label">Select the correct answer</div>
      <div class="q-text">${q.q}</div>
      <div class="choices">
        ${q.choices.map((c,i)=>{
          let cls='choice-btn';
          if(done){
            if(i===q.ans)cls+=' correct';
            else if(i===answered[current])cls+=' wrong';
          }
          return `<button class="${cls}"${done?' disabled':''} onclick="choose(${i})">${String.fromCharCode(65+i)}. ${c}</button>`;
        }).join('')}
      </div>
      <div class="feedback ${done?(answered[current]===q.ans?'correct-fb':'wrong-fb'):''} ${done?'show':''}">${done?(answered[current]===q.ans?'✓ Correct! ':'✗ Wrong. ')+q.exp:''}</div>
    </div>
    <div class="nav">
      <button onclick="prev()"${current===0?' disabled':''} style="${current===0?'opacity:0.4;cursor:default':''}">← Previous</button>
      <button class="primary" onclick="next()"${!done?' disabled style="opacity:0.4;cursor:default"':''}>
        ${current===shuffled.length-1?'Finish ✓':'Next →'}
      </button>
    </div>`;
}

function choose(i){
  if(answered[current]!==null)return;
  answered[current]=i;
  if(i===shuffled[current].ans)score++;
  render();
}
function next(){if(answered[current]===null)return;current++;render();}
function prev(){if(current>0){current--;render();}}

init();
</script>
</body>
</html>
